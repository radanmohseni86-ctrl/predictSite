{% extends 'games/base.html' %}
{% block title %}Login{% endblock %}
{% block content %}
<div style="max-width: 440px; margin: 60px auto;">
    <div class="card">
        <h2>Welcome back</h2>
        <p class="text-muted" style="margin-bottom: 28px;">Sign in to continue</p>
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" placeholder="Enter your username" required autofocus>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="••••••••" required>
            </div>
            <button type="submit">Sign in</button>
        </form>
        <p style="margin-top: 24px; text-align: center;">No account? <a href="{% url 'games:register' %}" style="color: #3b82f6;">Create one</a></p>
    </div>
</div>
{% endblock %}
