{% extends 'games/base.html' %}
{% load i18n %}
{% block title %}{% trans "Sign up" %}{% endblock %}
{% block content %}
<div style="max-width: 440px; margin: 60px auto;">
    <div class="card">
        <h2 style="margin-bottom: 8px;">{% trans "Create account" %}</h2>
        <p class="text-muted" style="margin-bottom: 28px;">{% trans "Join to start predicting the World Cup" %}</p>
        <form method="post">
            {% csrf_token %}
            <div style="margin-bottom: 16px;">
                <label style="color: var(--text-color); font-weight: 500;">{% trans "Username" %}</label>
                <input type="text" name="username" placeholder="{% trans 'Choose a username' %}" required>
            </div>
            <div style="margin-bottom: 16px;">
                <label style="color: var(--text-color); font-weight: 500;">{% trans "Email" %}</label>
                <input type="email" name="email" placeholder="{% trans 'your@email.com' %}" required>
            </div>
            <div style="margin-bottom: 16px;">
                <label style="color: var(--text-color); font-weight: 500;">{% trans "Password" %}</label>
                <input type="password" name="password1" placeholder="{% trans 'Create a password' %}" required>
            </div>
            <div style="margin-bottom: 24px;">
                <label style="color: var(--text-color); font-weight: 500;">{% trans "Confirm password" %}</label>
                <input type="password" name="password2" placeholder="{% trans 'Repeat password' %}" required>
            </div>
            <button type="submit" style="width: 100%;">{% trans "Sign up" %}</button>
        </form>
        <p style="margin-top: 24px; text-align: center; color: var(--muted-text);">
            {% trans "Already have an account?" %}
            <a href="{% url 'games:login' %}" style="color: var(--accent); text-decoration: none; font-weight: bold;">{% trans "Login" %}</a>
        </p>
    </div>
</div>
{% endblock %}
